name: Dispatch verified Issue 81 React stage
on:
  push:
    branches: ['operations/issue-81-stage-dispatch-4f9d023c']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Recheck approved main and prevent duplicate staging runs
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "5128c6bf26cdba8ddb3c2d88de65b2307d3661b4"
          count=$(gh api "repos/$GH_REPO/actions/workflows/stage-release.yml/runs?head_sha=5128c6bf26cdba8ddb3c2d88de65b2307d3661b4&event=workflow_dispatch&per_page=20" --jq .total_count)
          test "$count" = 0
      - name: Dispatch the existing protected default-branch workflow
        run: |
          gh workflow run stage-release.yml --repo "$GH_REPO" --ref main \
            -f source_sha=5128c6bf26cdba8ddb3c2d88de65b2307d3661b4 \
            -f artifact_sha256=26db29737f69e5bb20ecc7b138acb35656c68c3f4eea80defdfb6a3d1bfb9961 \
            -f distribution_tag=latest
